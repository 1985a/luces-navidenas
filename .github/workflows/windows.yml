name: Windows

# Compila y prueba la versión de Windows en un Windows real. Con «release», sube el instalador.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Etiqueta del release al que subir el instalador (vacío = solo compilar y probar)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["nucleo.py", "windows/**", "tests/**", ".github/workflows/windows.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r windows/requirements.txt

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Pruebas del núcleo
        run: python -I -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Compilar ejecutable e instalador
        run: python windows/build.py

      - name: Diagnóstico (temporal)
        shell: pwsh
        continue-on-error: true
        run: ./windows/diagnostico.ps1

      - name: Prueba de humo (instalar, usar, medir, desinstalar)
        shell: pwsh
        run: ./windows/prueba-humo.ps1

      - name: Guardar instalador, capturas y medidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luces-navidenas-windows
          path: |
            dist/
            artefactos/

      - name: Subir al release
        if: inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" (Get-ChildItem dist/*).FullName --clobber
